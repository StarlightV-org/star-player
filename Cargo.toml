[package]
name = "star-player"
version = "0.1.1"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.7.3", features = ["gpui-fast"] }
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit"] }
libloading = "0.8"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
csv = "1.4"
chrono = "0.4"
notify = "8"
trash = "5.2"
smallvec = "1"
raw-window-handle = "0.6"
tempfile = "3"
sha2 = "0.10"
zstd = { version = "0.13", default-features = false }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
semver = "1"
ed25519-dalek = "2"
base64 = "0.22"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
winresource = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
sevenz-rust2 = "0.24"
zstd = { version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Console", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Globalization"] }


[profile.release]
opt-level = 3
debug = false
strip = "debuginfo"
lto = "thin"
codegen-units = 1
